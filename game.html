<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; }
  .wrap { text-align: center; }
  canvas { width: min(96vw, 960px); image-rendering: pixelated; border: 2px solid #1e293b; border-radius: 8px; }
  p { color: #94a3b8; font-size: 14px; margin: 12px 0 0; }
  p b { color: #e5e7eb; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game"></canvas>
  <p><b>Snake</b> — arrow keys or WASD to steer. Eat the pink dots, don't hit the walls or yourself. Press R to restart.</p>
  <p>Built from one prompt by an AI agent, for make.fun.</p>
</div>
<script>
// snake-logic.js — pure Snake logic, no DOM.
// Shared by game.html (browser, keyboard + canvas) and render-frames.js
// (Node, headless simulation -> PPM frames). Same code, so the video
// footage is the real game playing, not a fake animation.

const W = 32; // grid cells wide
const H = 18; // grid cells tall

// Seeded RNG (LCG) so the rendered footage is reproducible.
// In the browser game.html uses Math.random instead.
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function createGame(rng) {
  const rand = rng || Math.random;
  const game = {
    w: W,
    h: H,
    // snake: array of {x,y}, head first. Starts centre, moving right.
    snake: [{ x: 16, y: 9 }, { x: 15, y: 9 }, { x: 14, y: 9 }],
    dir: { x: 1, y: 0 },
    pendingDir: null,
    food: null,
    score: 0,
    eaten: 0,
    over: false,
    steps: 0,
    rand,
  };
  spawnFood(game);
  return game;
}

function spawnFood(game) {
  const occupied = new Set(game.snake.map((s) => s.x + "," + s.y));
  let x, y;
  do {
    x = Math.floor(game.rand() * game.w);
    y = Math.floor(game.rand() * game.h);
  } while (occupied.has(x + "," + y));
  game.food = { x, y };
}

// dir: {x,y} — ignored if it would reverse the snake.
function setDir(game, dir) {
  if (game.over) return;
  const d = game.dir;
  if (dir.x === -d.x && dir.y === -d.y) return;
  if (dir.x === d.x && dir.y === d.y) return;
  game.pendingDir = dir;
}

// One tick. Returns 'ok' | 'ate' | 'dead'.
function step(game) {
  if (game.over) return "dead";
  if (game.pendingDir) {
    game.dir = game.pendingDir;
    game.pendingDir = null;
  }
  const head = game.snake[0];
  const nx = head.x + game.dir.x;
  const ny = head.y + game.dir.y;
  game.steps++;
  // Wall collision.
  if (nx < 0 || nx >= game.w || ny < 0 || ny >= game.h) {
    game.over = true;
    return "dead";
  }
  // Self collision (the tail cell frees up unless we eat, so check
  // against the body without the tail when not eating).
  const eating = game.food && nx === game.food.x && ny === game.food.y;
  const body = eating ? game.snake : game.snake.slice(0, -1);
  for (const s of body) {
    if (s.x === nx && s.y === ny) {
      game.over = true;
      return "dead";
    }
  }
  game.snake.unshift({ x: nx, y: ny });
  if (eating) {
    game.score += 10;
    game.eaten++;
    spawnFood(game);
    return "ate";
  }
  game.snake.pop();
  return "ok";
}

// Greedy AI steering for the rendered footage: head for the food,
// never reverse, never step into a wall or the body. Returns a dir.
function aiDir(game) {
  const head = game.snake[0];
  const food = game.food;
  const dirs = [
    { x: 1, y: 0 },
    { x: -1, y: 0 },
    { x: 0, y: 1 },
    { x: 0, y: -1 },
  ];
  const cur = game.dir;
  let best = null;
  let bestScore = Infinity;
  for (const d of dirs) {
    // No reversing.
    if (d.x === -cur.x && d.y === -cur.y) continue;
    const nx = head.x + d.x;
    const ny = head.y + d.y;
    if (nx < 0 || nx >= game.w || ny < 0 || ny >= game.h) continue;
    // Don't step into the body (tail frees up, so ignore the tail).
    let hit = false;
    for (let i = 0; i < game.snake.length - 1; i++) {
      if (game.snake[i].x === nx && game.snake[i].y === ny) {
        hit = true;
        break;
      }
    }
    if (hit) continue;
    const dist = Math.abs(nx - food.x) + Math.abs(ny - food.y);
    if (dist < bestScore) {
      bestScore = dist;
      best = d;
    }
  }
  // If no safe move toward food, take any safe non-reversing move.
  if (!best) {
    for (const d of dirs) {
      if (d.x === -cur.x && d.y === -cur.y) continue;
      const nx = head.x + d.x;
      const ny = head.y + d.y;
      if (nx < 0 || nx >= game.w || ny < 0 || ny >= game.h) continue;
      let hit = false;
      for (let i = 0; i < game.snake.length - 1; i++) {
        if (game.snake[i].x === nx && game.snake[i].y === ny) {
          hit = true;
          break;
        }
      }
      if (!hit) {
        best = d;
        break;
      }
    }
  }
  return best || cur;
}


// game-ui.js — browser UI for Snake. Runs after snake-logic.js in the
// same <script> block of game.html, so it sees W, H, createGame, setDir,
// step. Canvas rendering + keyboard controls + game loop.

(function () {
  var CELL = 20; // px per grid cell
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  canvas.width = W * CELL;
  canvas.height = H * CELL;

  var game = createGame(Math.random);
  var started = false;
  var lastStep = 0;
  var STEP_MS = 140;

  var KEYMAP = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },
    KeyW: { x: 0, y: -1 },
    KeyS: { x: 0, y: 1 },
    KeyA: { x: -1, y: 0 },
    KeyD: { x: 1, y: 0 },
  };

  function restart() {
    game = createGame(Math.random);
    started = false;
    lastStep = 0;
    draw();
  }

  document.addEventListener("keydown", function (e) {
    if (e.code === "KeyR") {
      restart();
      return;
    }
    var d = KEYMAP[e.code];
    if (!d) return;
    e.preventDefault();
    if (!started) started = true;
    setDir(game, d);
  });

  function draw() {
    // Background.
    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Subtle grid.
    ctx.strokeStyle = "#16203a";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= W; gx++) {
      ctx.moveTo(gx * CELL + 0.5, 0);
      ctx.lineTo(gx * CELL + 0.5, canvas.height);
    }
    for (var gy = 0; gy <= H; gy++) {
      ctx.moveTo(0, gy * CELL + 0.5);
      ctx.lineTo(canvas.width, gy * CELL + 0.5);
    }
    ctx.stroke();
    // Food: glowing pink dot.
    var f = game.food;
    var fx = f.x * CELL + CELL / 2;
    var fy = f.y * CELL + CELL / 2;
    ctx.fillStyle = "#f472b6";
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fbcfe8";
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // Snake: green body, brighter head.
    for (var i = game.snake.length - 1; i >= 0; i--) {
      var s = game.snake[i];
      ctx.fillStyle = i === 0 ? "#bbf7d0" : "#4ade80";
      var pad = i === 0 ? 1 : 2;
      ctx.fillRect(
        s.x * CELL + pad,
        s.y * CELL + pad,
        CELL - pad * 2,
        CELL - pad * 2
      );
    }
    // HUD: score top-left, title top-right.
    ctx.fillStyle = "rgba(11,18,32,0.75)";
    ctx.fillRect(0, 0, canvas.width, 30);
    ctx.fillStyle = "#e5e7eb";
    ctx.font = "bold 18px monospace";
    ctx.textBaseline = "middle";
    ctx.fillText("SCORE " + game.score, 10, 16);
    ctx.textAlign = "right";
    ctx.fillText("SNAKE", canvas.width - 10, 16);
    ctx.textAlign = "left";
    if (!started) {
      ctx.fillStyle = "rgba(11,18,32,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 26px monospace";
      ctx.textAlign = "center";
      ctx.fillText("SNAKE", canvas.width / 2, canvas.height / 2 - 14);
      ctx.font = "16px monospace";
      ctx.fillText(
        "Press an arrow key to start",
        canvas.width / 2,
        canvas.height / 2 + 16
      );
      ctx.textAlign = "left";
    } else if (game.over) {
      ctx.fillStyle = "rgba(11,18,32,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fca5a5";
      ctx.font = "bold 26px monospace";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 14);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "16px monospace";
      ctx.fillText(
        "Score " + game.score + " — press R to restart",
        canvas.width / 2,
        canvas.height / 2 + 16
      );
      ctx.textAlign = "left";
    }
  }

  function loop(t) {
    if (started && !game.over && t - lastStep >= STEP_MS) {
      lastStep = t;
      step(game);
    }
    draw();
    requestAnimationFrame(loop);
  }

  draw();
  requestAnimationFrame(loop);
})();

</script>
</body>
</html>
